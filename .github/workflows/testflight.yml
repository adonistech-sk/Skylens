# Builds SkyLens on GitHub's macOS runners and uploads it to TestFlight, so the app
# reaches an iPhone without owning a Mac. Signing is Xcode's automatic cloud signing
# through an App Store Connect API key: no certificates are created by hand.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID        App Store Connect API key ID, e.g. 2X9R4HXF34
#   ASC_ISSUER_ID     Issuer ID from the same page
#   ASC_KEY_P8        The whole contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID     Ten characters, from developer.apple.com → Membership
#   BUNDLE_ID         The identifier registered for the app, e.g. com.yourname.skylens
#
# Run it from the Actions tab with "Run workflow".

name: TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID BUNDLE_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "::error::Missing repository secret ASC_KEY_P8"; exit 1; fi

      - name: Install the API key
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Archive
        run: |
          xcodebuild archive \
            -project SkyLens.xcodeproj \
            -scheme SkyLens \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SkyLens.xcarchive" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E 'error:|warning: .*deprecated|\*\* ARCHIVE' || true
          grep -q '\*\* ARCHIVE SUCCEEDED' "$RUNNER_TEMP/archive.log"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SkyLens.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Keep the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
