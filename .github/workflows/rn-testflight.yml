# Archives the React Native app (skylens-rn/) and uploads it to TestFlight. The older
# testflight.yml builds the SwiftUI project, so running that one does not ship this app.
#
# Signing is Xcode's automatic cloud signing through an App Store Connect API key. It uses
# the same repository secrets as testflight.yml: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8,
# APPLE_TEAM_ID and BUNDLE_ID.
#
# It runs on a push to the rn-testflight branch. A workflow_dispatch button only appears
# once this file is on the default branch, and main is left alone until the owner merges:
#   git push origin HEAD:rn-testflight
#
# Build numbers start at 1001, so they stay above every SwiftUI build of this app.
#
# The repository variable TESTFLIGHT_INTERNAL_GROUP names the only group meant to receive a
# build. `guard` stops before the upload if any other group has automatic distribution, and
# `distribute` gives the processed build to that group. Nothing here can reach the App Store.

name: SkyLens RN TestFlight

on:
  push:
    branches: [rn-testflight]
  workflow_dispatch:

env:
  EXPO_NO_TELEMETRY: '1'

permissions:
  contents: read

jobs:
  guard:
    name: Check who would receive the build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stop unless one internal group can receive it
        run: node .github/scripts/testflight-asc.mjs guard

  upload:
    name: Archive and upload
    needs: guard
    runs-on: macos-26
    timeout-minutes: 100
    defaults:
      run:
        working-directory: skylens-rn
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID BUNDLE_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done
          if ! grep -q "\"bundleIdentifier\": \"$BUNDLE_ID\"" app.json; then
            echo "::error::The BUNDLE_ID secret does not match ios.bundleIdentifier in app.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skylens-rn/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test the astronomy
        run: |
          npx tsc --noEmit
          npx vitest run --reporter=dot

      - name: Install the API key
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate the native project
        run: npx expo prebuild --platform ios --no-install

      - name: Set the build number
        run: |
          echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $((1000 + GITHUB_RUN_NUMBER))" ios/SkyLens/Info.plist

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            skylens-rn/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-device-${{ runner.os }}-${{ hashFiles('skylens-rn/package-lock.json', 'skylens-rn/modules/**') }}

      - name: Install pods
        working-directory: skylens-rn/ios
        run: pod install

      - name: Archive
        working-directory: skylens-rn/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace SkyLens.xcworkspace \
            -scheme SkyLens \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SkyLens.xcarchive" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || {
              grep -nE 'error:|fatal error|\*\* ARCHIVE' "$RUNNER_TEMP/archive.log" | head -60
              tail -40 "$RUNNER_TEMP/archive.log"
              exit 1
            }
          grep -E '\*\* ARCHIVE' "$RUNNER_TEMP/archive.log"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SkyLens.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Keep the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rn-archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

  distribute:
    name: Give the build to the internal group
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Apple, then distribute
        run: BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER)) node .github/scripts/testflight-asc.mjs distribute
